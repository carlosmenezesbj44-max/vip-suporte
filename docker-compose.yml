version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: canal-direto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canal_direto
    ports:
      - "5432:5432"
    volumes:
      - canal-direto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canal_direto"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: canal-direto-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/canal_direto?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      IXC_API_URL: ${IXC_API_URL:-https://agilitytelecomudp.com.br/webservice/v1}
      IXC_API_TOKEN: ${IXC_API_TOKEN:-ID_DO_USUARIO:TOKEN_NOVO}
      PORT: 3333
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api}
    container_name: canal-direto-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api}
    ports:
      - "3000:3000"
    depends_on:
      - api

  dev:
    image: node:20-alpine
    container_name: canal-direto-dev
    working_dir: /workspace
    command: sh -c "npm run build:shared && npm run prisma:generate && npm run prisma:migrate:deploy && npm run dev:api & npm run dev:web"
    volumes:
      - .:/workspace
      - canal-direto-node-modules:/workspace/node_modules
      - canal-direto-api-node-modules:/workspace/apps/api/node_modules
      - canal-direto-web-node-modules:/workspace/apps/web/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/canal_direto?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      IXC_API_URL: ${IXC_API_URL:-https://agilitytelecomudp.com.br/webservice/v1}
      IXC_API_TOKEN: ${IXC_API_TOKEN:-ID_DO_USUARIO:TOKEN_NOVO}
      PORT: 3333
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
    ports:
      - "3333:3333"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - development

    # Development containers keep dependencies isolated from host node_modules.

volumes:
  canal-direto-pgdata:
  canal-direto-node-modules:
  canal-direto-api-node-modules:
  canal-direto-web-node-modules:
